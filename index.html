<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBI National Security Terminal</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050b14;
            color: #00ff66;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Scanline Overlay Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Centralized Terminal Container */
        .terminal-container {
            width: 480px;
            background-color: #0a1424;
            border: 2px solid #0055ff;
            box-shadow: 0 0 20px rgba(0, 85, 255, 0.4);
            padding: 30px;
            border-radius: 4px;
            position: relative;
            z-index: 2;
        }

        /* FBI Header Elements */
        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px dashed #0055ff;
            padding-bottom: 15px;
        }

        /* Simulated FBI Eagle Emblem */
        .fbi-badge {
            width: 70px;
            height: 70px;
            border: 3px double #0055ff;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #0055ff;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0, 85, 255, 0.5);
            background: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0, 85, 255, 0.05) 2px, rgba(0, 85, 255, 0.05) 4px);
        }

        .header h1 {
            font-size: 20px;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .header p {
            font-size: 11px;
            color: #a0aec0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Legal Disclaimer Warning box */
        .warning-box {
            background-color: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff3333;
            color: #ff6666;
            padding: 10px;
            font-size: 10px;
            line-height: 1.4;
            margin-bottom: 25px;
            text-align: justify;
            text-transform: uppercase;
        }

        /* Form Controls */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #0055ff;
            margin-bottom: 6px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            background-color: #050b14;
            border: 1px solid #0055ff;
            padding: 12px 10px;
            color: #00ff66;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
            outline: none;
            border-radius: 2px;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        /* Action Buttons */
        .btn-submit {
            width: 100%;
            background-color: #0055ff;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 2px;
            transition: background 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 85, 255, 0.4);
        }

        .btn-submit:hover {
            background-color: #0044cc;
            color: #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        /* Lower Status Footer Bar */
        .footer-status {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #4a5568;
            border-top: 1px solid #1a202c;
            padding-top: 10px;
        }

        .status-dot {
            color: #ff3333;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <!-- FBI Header -->
        <div class="header">
            <div class="fbi-badge">F B I</div>
            <h1>FEDERAL BUREAU</h1>
            <p>of Investigation</p>
        </div>

        <!-- Official Warning Text -->
        <div class="warning-box">
            WARNING: THIS IS A FEDERAL COMPUTER SYSTEM. THIS SYSTEM IS FOR OFFICIAL USE ONLY. UNAUTHORIZED ACCESS IS STRICTLY PROHIBITED AND SUBJECT TO CRIMINAL AND CIVIL PENALTIES. PUBLIC LAW 99-474.
        </div>

        <!-- Login Fields -->
        <form onsubmit="event.preventDefault(); alert('Access Denied: Credentials Logged.');">
            <div class="input-group">
                <label for="badge">Badge Number</label>
                <input type="text" id="badge" placeholder="X-XXXX" autocomplete="off" required>
            </div>

            <div class="input-group">
                <label for="passkey">Encryption Passkey</label>
                <input type="password" id="passkey" placeholder="••••••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Authorize Session</button>
        </form>

        <!-- System Details Footer -->
        <div class="footer-status">
            <span>SYS_LOC: CLASSIFIED</span>
            <span>SECURE_CONN <span class="status-dot">●</span></span>
        </div>
    </div>

</body>
</html>
